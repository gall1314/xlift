# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:

  # Codegen emits the UIScene lifecycle itself where it is safe (see
  # useUISceneLifecycle). Flutter's migrator would also rewrite the legacy
  # AppDelegate that every other build still needs.
  config:
    # Flutter uses Swift Package Manager for compatible plugins and CocoaPods
    # for the rest. Projects using the managed Firebase Analytics/GenUI graph
    # stay CocoaPods-only so privacy behavior and wrapper versions are stable.
    enable-swift-package-manager: true
    enable-uiscene-migration: false

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/fonts/
    - assets/images/
    - assets/videos/
    - assets/audios/
    - assets/rive_animations/
    - assets/pdfs/
    - assets/jsons/

    - assets/sqlite_db_files/
  fonts:
    - family: XliftIcons
      fonts:
        - asset: assets/fonts/xlift_icons.ttf


  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

